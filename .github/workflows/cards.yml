name: cards
on:
  workflow_dispatch: {}
  push: { paths: [card.html, render.py, sample.json, .github/workflows/cards.yml] }
permissions: { contents: read }
concurrency: { group: cards }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright==1.55.0 && google-chrome --version && (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      - run: python3 render.py sample.json out
      - uses: actions/upload-artifact@v4
        with: { name: cards, path: out, retention-days: 3 }
